<main id="main">
  <!-- Hero / quiz invitation -->
  <section class="section section--alt hero" aria-labelledby="hero-title">
    <div class="container hero__inner">
      <div class="hero__text">
        <p class="eyebrow">60-second skin quiz</p>
        <h1 id="hero-title">Discover What Your Skin Needs</h1>
        <p class="hero__sub">
          Tell us what your skin needs — we'll find what suits it best.
        </p>

        <div class="hero__cta">
          <a class="moon-btn moon-btn--primary moon-btn--lg" routerLink="/quiz">Find Your Match</a>
          <a class="hero__skip" routerLink="/shop">Browse all products</a>
        </div>
      </div>

      <div class="hero__media">
        <product-image
          src="assets/hero/background.jpeg"
          alt="MoonCosmo scrub jar resting among fresh flowers"
          label="MoonCosmo"
          [width]="1600"
          [height]="1200"
          [eager]="true"
        />
      </div>
    </div>
  </section>

  <!-- Customer reviews, across the whole range rather than grouped per product.
       Hidden entirely when there are no reviews, rather than rendering an empty shell. -->
  @if (reviews.length > 0) {
    <section class="section reviews" aria-labelledby="reviews-title">
      <div class="container">
        <div class="reviews__head">
          <p class="eyebrow">In their words</p>
          <h2 id="reviews-title" class="reviews__title">{{ reviewsHeading }}</h2>
        </div>
      </div>

      <div class="container reviews__body">
        <reviews-carousel [reviews]="reviews" />
      </div>
    </section>
  }

  <site-footer />
</main>
